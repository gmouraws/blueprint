name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build and verify server-only secret isolation
        run: npm run build
        env:
          DISCORD_BOT_TOKEN: ci-canary-discord-registration-not-a-real-secret
          DISCORD_STREAM_WEBHOOK_URL: ci-canary-discord-webhook-not-a-real-secret
          BETTER_AUTH_SECRET: ci-canary-account-secret-not-a-real-secret
          RESEND_API_KEY: ci-canary-email-key-not-a-real-secret
          SESSION_SECRET: ci-canary-signing-key-not-a-real-secret
          LIVEKIT_API_KEY: ci-canary-api-key
          LIVEKIT_API_SECRET: ci-canary-livekit-secret-not-a-real-secret
          UPSTASH_REDIS_REST_TOKEN: ci-canary-redis-token-not-a-real-secret
          DATABASE_URL: ci-canary-database-url-not-a-real-secret
          DATABASE_URL_UNPOOLED: ci-canary-direct-database-url-not-a-real-secret
          CRON_SECRET: ci-canary-cron-secret-not-a-real-secret
          BLOB_READ_WRITE_TOKEN: ci-canary-blob-token-not-a-real-secret
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify on-demand screen transport against loopback LiveKit
        run: bash scripts/test-guest-transport.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
