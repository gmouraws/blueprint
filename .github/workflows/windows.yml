name: Windows test installer
on:
  pull_request:
    paths: ['desktop/**', 'src/lib/shared/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: Copy-Item src/lib/shared/keybindings.mjs desktop/keybindings.mjs
      - run: npm test --prefix desktop
      - run: npm run build --prefix desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blueprint-room-windows-preview-test
          path: |
            desktop/dist/*preview*.exe
            desktop/dist/SHA256SUMS-preview.txt
          retention-days: 14
