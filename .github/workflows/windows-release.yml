name: Publish approved Windows test release
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: windows-test-release-0.1.3
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'gmouraws/blueprint' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'gmouraws/blueprint'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Gate the specifically authorized version
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($version -ne '0.1.3') { throw 'This workflow authorizes only 0.1.3. Review a new release decision first.' }
          gh release view windows-v0.1.3 --repo gmouraws/blueprint --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { 'publish=false' >> $env:GITHUB_OUTPUT } else { 'publish=true' >> $env:GITHUB_OUTPUT }
          exit 0
      - if: steps.gate.outputs.publish == 'true'
        run: npm ci
      - if: steps.gate.outputs.publish == 'true'
        run: npm ci --prefix desktop
      - if: steps.gate.outputs.publish == 'true'
        run: Copy-Item src/lib/shared/keybindings.mjs desktop/keybindings.mjs
      - if: steps.gate.outputs.publish == 'true'
        run: npm test --prefix desktop
      - if: steps.gate.outputs.publish == 'true'
        working-directory: desktop
        run: node build.mjs --production
      - name: Publish immutable test assets
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          $installer = 'desktop/dist/Blueprint-Room-production-0.1.3-x64-setup.exe'
          $expected = (Get-Content desktop/dist/SHA256SUMS-production.txt).Split(' ')[0]
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Checksum mismatch' }
          gh release create windows-v0.1.3 $installer desktop/dist/SHA256SUMS-production.txt --repo gmouraws/blueprint --target $env:RELEASE_COMMIT --prerelease --title 'Blueprint Room 0.1.3 — unsigned Windows test' --notes-file docs/windows-0.1.3-release.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
